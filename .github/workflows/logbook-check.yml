name: logbook check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # R5 compares each journal file with its committed version, so the
          # checkout needs real history rather than a single squashed commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This repository keeps its own logbook, so it runs the checker it ships.
      # In your repository the step is:  npx --yes agent-logbook check
      - name: Check the logbook
        run: node bin/logbook.js check

      # On a pull request, also require that the branch wrote something down.
      # This is the same gate hooks/pre-push applies, repeated here for anyone
      # who pushed with --no-verify. It needs the fetch-depth: 0 above, so that
      # origin/<base branch> is a revision this clone actually has.
      - name: Check that this delivery is recorded
        if: github.event_name == 'pull_request'
        run: node bin/logbook.js check --require-entry-since "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
